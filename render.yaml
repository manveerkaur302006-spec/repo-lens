databases:
  # 1. POSTGRES (Fully automated native DB, spins up instantly)
  - name: repolens-postgres
    databaseName: repolens
    user: repolens
    plan: free

services:
  # 2. CHROMADB (Directly pulls from Docker Hub)
  - type: web
    name: repolens-chromadb
    env: image
    image:
      url: chromadb/chroma:0.6.3
    plan: free
    envVars:
      - key: ANONYMIZED_TELEMETRY
        value: "false"
      - key: PORT
        value: 8000

  # 3. BACKEND (built from this repository)
  - type: web
    name: repolens-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      # Automatically fetches the connection string from the DB above
      - key: DATABASE_URL
        fromDatabase:
          name: repolens-postgres
          property: connectionString
      # Enter Aura details as Render secrets during the first Blueprint deploy.
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHROMA_HOST
        value: repolens-chromadb
      - key: CHROMA_PORT
        value: 8000
      - key: CLONE_DIR
        value: /tmp/repos

  # 4. FRONTEND (built from this repository)
  - type: web
    name: repolens-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        value: "https://repolens-backend.onrender.com"
