databases:
  # 1. POSTGRES (Fully automated native DB, spins up instantly)
  - name: repolens-postgres
    databaseName: repolens
    user: repolens
    plan: free

services:
  # Backend (built from this repository)
  - type: web
    name: repolens-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      # Automatically fetches the connection string from the DB above
      - key: DATABASE_URL
        fromDatabase:
          name: repolens-postgres
          property: connectionString
      # Enter these provider credentials as Render secrets during the first
      # Blueprint deploy. They are intentionally not committed to Git.
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false
      - key: CLONE_DIR
        value: /tmp/repos
